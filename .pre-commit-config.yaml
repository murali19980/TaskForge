repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: block-env-and-keys
        name: Block .env and API keys
        entry: python scripts/pre_commit_secrets_check.py
        language: system
        files: ^.*$
